[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/", "forge-multibaas/=lib/forge-multibaas/src/"]
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read-write", path = "../deployments" }]
[fuzz]
runs = 256

# Existing Curvegrid Testnet deployments were compiled for Paris.
# Sepolia + the official ENSv2 bytecode require Cancun.
[profile.curvegrid]
evm_version = "paris"
