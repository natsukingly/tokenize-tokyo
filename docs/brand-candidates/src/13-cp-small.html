<!doctype html><html><head><meta charset="utf-8"><title>TOKENIZE TOKYO - CP Small</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&display=swap" rel="stylesheet">
<script>if(new URLSearchParams(location.search).get('bg')==='dark')document.documentElement.classList.add('dark')</script>
<style>
@font-face{font-family:'Cyberway Riders';src:url(fonts/CyberwayRiders.otf) format('opentype')}
:root{--y:#FCEE0A;--c:#00F0FF}
html,body{margin:0;background:transparent;width:100%;height:100%;overflow:hidden}
html.dark,html.dark body{background:#0b0c0f}
body{display:flex;align-items:center;justify-content:center}
.mark{display:flex;flex-direction:column;align-items:flex-end}
.w1{position:relative;font-family:'Cyberway Riders';font-size:15vw;line-height:1;white-space:nowrap}
.w1 .ye,.w1 .cy{display:block}
.w1 .ye{position:relative;color:var(--y)}
.w1 .cy{position:absolute;left:0;top:0;color:var(--c);transform:translate(-.03em,.03em)}
.w1 span{display:inline-block}
.k-e{margin-left:-.03em}.k-z{margin-left:-.035em;transform:translateY(.04em)}
.w2{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:5.6vw;line-height:1;color:var(--y);
  letter-spacing:.2em;text-transform:uppercase;margin-top:1.6vw;margin-right:calc(-.2em - 1.4vw)}
</style></head><body>
<div class="mark">
  <div class="w1"><div class="ye"><span>T</span><span class="k-o">O</span><span class="k-k">K</span><span class="k-e">E</span><span class="k-n">N</span><span class="k-i">I</span><span class="k-z">Z</span><span class="k-e2">E</span></div></div>
  <div class="w2">TOKYO</div>
</div>
<script>
const ye=document.querySelector('.w1 .ye'),cy=ye.cloneNode(true);cy.className='cy';ye.parentNode.insertBefore(cy,ye);
</script></body></html>
