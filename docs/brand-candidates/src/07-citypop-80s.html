<!doctype html><html><head><meta charset="utf-8"><title>TOKENIZE TOKYO - City Pop</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Audiowide&family=M+PLUS+Rounded+1c:wght@300&display=swap" rel="stylesheet">
<script>if(new URLSearchParams(location.search).get("bg")==="dark")document.documentElement.classList.add("dark")</script>
<style>html,body{margin:0;background:transparent;width:2000px;height:700px;overflow:hidden}body{display:flex;align-items:center;justify-content:center}
html.dark,html.dark body{background:#0b0c0f}
.w{position:relative;display:flex;flex-direction:column;align-items:center}
.sun{position:absolute;left:50%;top:-50px;width:400px;height:400px;transform:translateX(-50%);border-radius:50%;
 background:linear-gradient(#FFD36E,#FF71CE 55%,#7A5CFF);
 -webkit-mask-image:linear-gradient(#000 0 48%,transparent 48% 52%,#000 52% 60%,transparent 60% 65%,#000 65% 72%,transparent 72% 78%,#000 78% 84%,transparent 84% 91%,#000 91%);opacity:.95}
.kata{position:relative;font-family:'M PLUS Rounded 1c';font-weight:300;font-size:64px;letter-spacing:.8em;margin-right:-.8em;color:#fff;text-shadow:0 0 12px #FF71CE,0 0 2px #FF71CE}
.t1,.t2{position:relative;font-family:Audiowide;font-style:italic;line-height:1;white-space:nowrap;transform:skewX(-12deg);
 background:linear-gradient(180deg,#fff 0%,#FF71CE 38%,#7A5CFF 52%,#01CDFE 53%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 10px rgba(255,113,206,.7)) drop-shadow(4px 5px 0 #2a1450)}
.t1{font-size:200px;letter-spacing:.02em}
.t2{font-family:Monoton;font-size:170px;letter-spacing:.14em;margin-top:-10px;
 background:linear-gradient(90deg,#FF71CE,#7A5CFF 50%,#01CDFE);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 14px rgba(1,205,254,.8))}
.tag{position:relative;font-family:Audiowide;font-size:30px;margin-top:14px;letter-spacing:.5em;margin-right:-.5em;color:#01CDFE;margin-top:6px;text-shadow:0 0 8px #01CDFE}
</style></head><body>
<div class="w"><div class="sun"></div>
 <div class="kata">トーキョー</div>
 <div class="t1">TOKENIZE</div>
 <div class="t2">TOKYO</div>
 <div class="tag">1985 / 2026</div>
</div></body></html>
