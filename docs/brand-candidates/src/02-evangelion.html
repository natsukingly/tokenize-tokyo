<!doctype html><html><head><meta charset="utf-8"><title>TOKENIZE TOKYO - Eva</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<script>if(new URLSearchParams(location.search).get("bg")==="dark")document.documentElement.classList.add("dark")</script>
<style>html,body{margin:0;background:transparent;width:2000px;height:700px;overflow:hidden}body{display:flex;align-items:center;justify-content:center}
html.dark,html.dark body{background:#000}
.card{position:relative;display:flex;align-items:center;gap:40px;margin-left:-300px;color:#fff}
.main{display:flex;flex-direction:column;align-items:flex-start;margin-right:230px}
.ep{font-family:'Shippori Mincho B1';font-weight:800;font-size:46px;letter-spacing:.02em;transform:scaleX(1.15);transform-origin:left;margin-bottom:6px}
.big{font-family:'Playfair Display';font-weight:900;line-height:.8;letter-spacing:-.06em;transform:scaleX(1.18);transform-origin:left}
.b1{font-size:250px}
.b2{font-size:250px;margin-left:120px}
.sub{font-family:'Shippori Mincho B1';font-weight:800;font-size:60px;letter-spacing:-.02em;transform:scaleX(1.15);transform-origin:left;margin-top:22px}
.vert{font-family:'Shippori Mincho B1';font-weight:800;font-size:54px;writing-mode:vertical-rl;letter-spacing:-.02em;line-height:1;align-self:stretch;display:flex;align-items:flex-end;justify-content:center}
</style></head><body>
<div class="card">
 <div class="main">
  <div class="ep">第壱話</div>
  <div class="big b1">TOKENIZE</div>
  <div class="big b2">TOKYO</div>
  <div class="sub">東京、資産化。</div>
 </div>
 <div class="vert">新世紀トウキョウ</div>
</div></body></html>
