<!doctype html><html><head><meta charset="utf-8"><title>TOKENIZE TOKYO - Sentai</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<script>if(new URLSearchParams(location.search).get("bg")==="dark")document.documentElement.classList.add("dark")</script>
<style>html,body{margin:0;background:transparent;width:2000px;height:700px;overflow:hidden}body{display:flex;align-items:center;justify-content:center}
html.dark,html.dark body{background:#0b0c0f}
.w{position:relative;display:flex;flex-direction:column;align-items:center}
.burst{position:absolute;left:50%;top:50%;width:1500px;height:1500px;transform:translate(-50%,-50%);
 background:repeating-conic-gradient(from 0deg,rgba(255,212,0,.9) 0 4deg,transparent 4deg 12deg);
 -webkit-mask-image:radial-gradient(closest-side,transparent 18%,#000 30%,rgba(0,0,0,.6) 50%,transparent 68%);clip-path:ellipse(48% 22% at 50% 50%)}
.jp,.en{font-family:'Dela Gothic One';position:relative;transform:skewX(-14deg);white-space:nowrap}
.jp{font-size:215px;line-height:1.05;color:#FFD400;letter-spacing:-.04em;-webkit-text-stroke:10px #000;paint-order:stroke fill;
 text-shadow:4px 4px 0 #E62E2E,8px 8px 0 #E62E2E,12px 12px 0 #E62E2E,16px 16px 0 #E62E2E,20px 20px 0 #E62E2E,24px 24px 0 #000,28px 28px 0 #000}
.jp .k{color:#fff}
.en{margin-top:4px;font-size:84px;color:#fff;background:#E62E2E;padding:6px 40px 12px;letter-spacing:.08em;border:7px solid #000;box-shadow:12px 12px 0 #000;text-shadow:5px 5px 0 #000}
</style></head><body>
<div class="w"><div class="burst"></div>
 <div class="jp">トークナイズ<span class="k">東京</span></div>
 <div class="en">TOKENIZE TOKYO</div>
</div></body></html>
