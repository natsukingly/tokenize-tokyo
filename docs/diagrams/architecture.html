<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TOKENIZE TOKYO Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #111214; }
  svg { display: block; width: 2000px; height: 1250px; }
  .cond { font-family: "Barlow Condensed", sans-serif; }
  .sans { font-family: "IBM Plex Sans", sans-serif; }
  .mono { font-family: "IBM Plex Mono", monospace; }
</style>
</head>
<body>
<svg id="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1250" width="2000" height="1250"></svg>
<script>
const C = {
  bg: '#111214', panel: '#191b1f', panel2: '#1f2126', line: '#34373d', text: '#f1f2f3',
  muted: '#a6a9ae', yellow: '#f0df37', accent2: '#b8bbc1', edge: '#c3c6cc', pend: '#8d9096', group: '#141518'
};
const W = 2000, H = 1250;
const PAD = 18;

// ---------- lanes ----------
const lanes = [
  { label: ['PEOPLE &', 'SIGNING'], y0: 118, y1: 282 },
  { label: ['APPLICATION'], y0: 282, y1: 470 },
  { label: ['MULTIBAAS'], y0: 470, y1: 790 },
  { label: ['ON-CHAIN'], y0: 790, y1: 1190 },
];

// ---------- groups ----------
const groups = [
  { x: 480, y: 560, w: 1110, h: 215, title: 'CURVEGRID MULTIBAAS', sub: 'connected on Curvegrid Testnet', subBelow: true },
  { x: 210, y: 815, w: 1390, h: 367, title: 'EVM: CURVEGRID TESTNET', sub: '• chain ID 2017072401', subBelow: false },
];

// ---------- nodes ----------
const N = {
  user:    { x: 720,  y: 150, w: 320, h: 100, title: 'User', body: ['Owner / Investor / Demo verifier'], primary: true },
  wallet:  { x: 1630, y: 150, w: 280, h: 100, title: 'Browser wallet', body: ['Signs and submits'] },
  hook:    { x: 210,  y: 315, w: 290, h: 140, title: 'Next.js webhook endpoint', body: ['HMAC + timestamp + delivery deduplication'], pending: true },
  ui:      { x: 760,  y: 315, w: 510, h: 140, title: 'Next.js application', body: ['Explore / Assets / Tokenize / Portfolio / Compose / Activity'] },
  map:     { x: 1320, y: 315, w: 280, h: 140, title: '3D Tokyo', body: ['MapLibre + OpenStreetMap', 'Simulated asset scopes; PLATEAU planned'] },
  lab:     { x: 1650, y: 315, w: 260, h: 140, title: 'Markets: fractional / rental sandbox', body: ['Separate mock credits, no chain transactions'] },
  admin:   { x: 210,  y: 625, w: 230, h: 130, title: 'Deployment CLI', body: ['Admin key: server / local environment only'] },
  mgmt:    { x: 510,  y: 625, w: 260, h: 130, title: 'Contract definitions / ABI / linking', body: ['Decoded Transaction Explorer'] },
  index:   { x: 830,  y: 625, w: 350, h: 130, title: 'Event Indexing + Event Queries', body: ['Lifecycle, listings, sales and revenue totals'] },
  mb:      { x: 1230, y: 625, w: 330, h: 130, title: ['TypeScript SDK /', 'Contracts API'], body: [] },
  operator:{ x: 1630, y: 625, w: 280, h: 130, title: 'Cloud Wallet + TXM adapter', body: ['Implemented, not configured / live-tested'], pending: true },
  registry:{ x: 240,  y: 900, w: 290, h: 105, title: 'UrbanAssetRegistry', body: ['Asset registration + verifier role'] },
  rights:  { x: 760,  y: 900, w: 290, h: 105, title: 'UrbanRightToken', tag: 'ERC-1155', body: ['Space, time, purpose, transfer policy'] },
  basket:  { x: 1280, y: 900, w: 290, h: 105, title: 'BasketVault', tag: 'ERC-1155', body: ['Underlying custody + mint / redeem'] },
  revenue: { x: 240,  y: 1065, w: 290, h: 105, title: 'RevenueVault', body: ['Real test-token deposits + claims'] },
  cash:    { x: 760,  y: 1065, w: 290, h: 105, title: 'MockJPY', tag: 'test ERC-20', body: ['No monetary value'] },
  market:  { x: 1280, y: 1065, w: 290, h: 105, title: 'UrbanMarketplace', body: ['Atomic primary / secondary sales'] },
  ens:     { x: 1640, y: 845, w: 270, h: 160, title: 'ENSv2 on Sepolia', body: ['Read adapter implemented locally; Registration + issuance delegation pending'], pending: true },
};

// ---------- edges ----------
// kind: 'solid' (arrow), 'dash' (pending arrow), 'link' (undirected)
const E = [
  { id: 1,  kind: 'solid', pts: [[880,250],[880,315]] },
  { id: 2,  kind: 'solid', pts: [[1320,385],[1270,385]] },
  { id: 3,  kind: 'solid', pts: [[1255,455],[1255,625]], label: { lines: ['DApp User key: reads, Event Queries,', 'unsigned composition'], x: 1270, y: 506, anchor: 'start', key: true } },
  { id: 4,  kind: 'solid', pts: [[1110,315],[1110,200],[1630,200]], label: { lines: ['Composed transaction'], x: 1370, y: 200 } },
  { id: 5,  kind: 'solid', pts: [[1910,200],[1948,200],[1948,1040],[1600,1040]], label: { lines: ['Signed transaction'], x: 1774, y: 1040, key: true } },
  { id: 6,  kind: 'solid', pts: [[1395,755],[1395,815]], label: { lines: ['Contract reads / simulation'], x: 1395, y: 795 } },
  { id: 7,  kind: 'solid', pts: [[1000,815],[1000,755]], label: { lines: ['Contract events'], x: 1000, y: 795 } },
  { id: 8,  kind: 'solid', pts: [[1000,625],[1000,455]], label: { lines: ['Query results → projection.ts', '→ market state'], x: 1000, y: 520, key: true } },
  { id: 9,  kind: 'solid', pts: [[440,690],[510,690]] },
  { id: 10, kind: 'link',  pts: [[640,755],[640,815]] },
  { id: 11, kind: 'link',  pts: [[1780,315],[1780,296],[1220,296],[1220,315]] },
  { id: 12, kind: 'dash',  pts: [[850,625],[850,490],[400,490],[400,455]], label: { lines: ['Signed webhook; external delivery pending'], x: 625, y: 490 } },
  { id: 13, kind: 'dash',  pts: [[500,385],[760,385]], label: { lines: ['Activity revision polling', '→ rerun Event Queries'], x: 630, y: 385 } },
  { id: 14, kind: 'dash',  pts: [[1640,872],[960,872],[960,900]], label: { lines: ['Future same-chain authority adapter'], x: 1420, y: 872 } },
  { id: 15, kind: 'dash',  pts: [[1630,690],[1560,690]] },
  // inside chain
  { id: 'c1', kind: 'solid', pts: [[530,952],[760,952]], label: { lines: ['Verified asset linkage'], x: 645, y: 952 } },
  { id: 'c2', kind: 'link',  pts: [[1010,1005],[1010,1035],[1330,1035],[1330,1065]] },
  { id: 'c3', kind: 'link',  pts: [[800,1005],[800,1035],[385,1035],[385,1065]] },
  { id: 'c4', kind: 'solid', pts: [[1050,952],[1280,952]], label: { lines: ['Underlying rights'], x: 1165, y: 952 } },
  { id: 'c5', kind: 'link',  pts: [[1480,1005],[1480,1065]] },
  { id: 'c6', kind: 'link',  pts: [[1050,1117],[1280,1117]] },
  { id: 'c7', kind: 'link',  pts: [[530,1117],[760,1117]] },
];

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('d');
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
function txt(str, attrs, parent) { const t = el('text', attrs, parent); t.textContent = str; return t; }
const warn = [];

// measuring
const meas = el('text', { x: -9999, y: -9999 });
function width(str, cls, size, weight) {
  meas.setAttribute('class', cls); meas.setAttribute('font-size', size); meas.setAttribute('font-weight', weight);
  meas.textContent = str; return meas.getComputedTextLength();
}
function wrap(str, maxW, cls, size, weight) {
  const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (width(t, cls, size, weight) <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  lines.forEach(l => { if (width(l, cls, size, weight) > maxW) warn.push('overflow word: ' + l); });
  return lines;
}

function build() {
  el('rect', { x: 0, y: 0, width: W, height: H, fill: C.bg });
  const defs = el('defs', {});
  function marker(id, color) {
    const m = el('marker', { id, viewBox: '0 0 12 12', refX: 11, refY: 6, markerWidth: 12, markerHeight: 12, markerUnits: 'userSpaceOnUse', orient: 'auto' }, defs);
    el('path', { d: 'M0,0 L12,6 L0,12 z', fill: color }, m);
  }
  marker('arr', C.edge); marker('arrP', C.pend);

  // title
  txt('TOKENIZE TOKYO', { x: 40, y: 66, class: 'cond', 'font-size': 46, 'font-weight': 800, fill: C.yellow, 'letter-spacing': 1 });
  const tw = width('TOKENIZE TOKYO', 'cond', 46, 800) + 14;
  txt('— Architecture', { x: 40 + tw + 12, y: 66, class: 'cond', 'font-size': 46, 'font-weight': 800, fill: C.text });
  txt('Urban Rights contracts enforce ownership, transfer rules and payments; MultiBaas supplies reads, indexed history and transaction composition.',
      { x: 40, y: 100, class: 'sans', 'font-size': 19, 'font-weight': 400, fill: C.muted });

  // lanes
  el('line', { x1: 190, y1: lanes[0].y0, x2: 190, y2: lanes[3].y1, stroke: C.line, 'stroke-width': 1 });
  lanes.forEach((ln, i) => {
    if (i > 0) el('line', { x1: 30, y1: ln.y0, x2: 1970, y2: ln.y0, stroke: '#26282d', 'stroke-width': 1 });
    const cy = (ln.y0 + ln.y1) / 2 - (ln.label.length - 1) * 13;
    ln.label.forEach((l, j) => txt(l, { x: 40, y: cy + 7 + j * 26, class: 'cond', 'font-size': 20, 'font-weight': 600, fill: C.muted, 'letter-spacing': 3 }));
  });
  el('line', { x1: 30, y1: lanes[0].y0, x2: 1970, y2: lanes[0].y0, stroke: '#26282d', 'stroke-width': 1 });
  el('line', { x1: 30, y1: lanes[3].y1, x2: 1970, y2: lanes[3].y1, stroke: '#26282d', 'stroke-width': 1 });

  // groups
  groups.forEach(g => {
    el('rect', { x: g.x, y: g.y, width: g.w, height: g.h, rx: 10, fill: C.group, stroke: C.line, 'stroke-width': 1.5 });
    const t = txt(g.title, { x: g.x + 30, y: g.y + 32, class: 'cond', 'font-size': 23, 'font-weight': 800, fill: C.yellow, 'letter-spacing': 1.5 });
    if (g.subBelow) txt(g.sub, { x: g.x + 30, y: g.y + 55, class: 'sans', 'font-size': 16, fill: C.muted });
    else txt(g.sub, { x: g.x + 30 + width(g.title, 'cond', 23, 800) + g.title.length * 1.5 + 12, y: g.y + 32, class: 'sans', 'font-size': 16, fill: C.muted });
  });

  // edges (lines first)
  const labelBoxes = [];
  E.forEach(e => {
    const d = e.pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ',' + p[1]).join(' ');
    const a = { d, fill: 'none', 'stroke-width': 2.2, 'stroke-linejoin': 'round' };
    if (e.kind === 'dash') { a.stroke = C.pend; a['stroke-dasharray'] = '8 8'; a['marker-end'] = 'url(#arrP)'; }
    else { a.stroke = C.edge; if (e.kind === 'solid') a['marker-end'] = 'url(#arr)'; }
    el('path', a);
  });

  // nodes
  Object.entries(N).forEach(([id, n]) => {
    const g = el('g', {});
    const r = { x: n.x, y: n.y, width: n.w, height: n.h, rx: 6, fill: C.panel, stroke: n.primary ? C.yellow : (n.pending ? C.pend : C.line), 'stroke-width': n.primary ? 2 : 1.5 };
    if (n.pending) r['stroke-dasharray'] = '8 8';
    el('rect', r, g);
    const inner = n.w - PAD * 2;
    const tagW = n.tag ? width(n.tag, 'mono', 13, 500) + 12 : 0;
    const tl = Array.isArray(n.title) ? n.title : wrap(n.title, inner - (tagW ? tagW + 8 : 0), 'cond', 26, 800);
    const bl = [].concat(...n.body.map(b => wrap(b, inner, 'sans', 18, 400)));
    const contentH = 20 + (tl.length - 1) * 28 + (bl.length ? 10 + bl.length * 24 : 0);
    let y = n.y + (n.h - contentH) / 2 + 20;
    if (contentH + 20 > n.h) warn.push('node too tall: ' + id + ' content ' + contentH);
    tl.forEach((l, i) => txt(l, { x: n.x + PAD, y: y + i * 28, class: 'cond', 'font-size': 26, 'font-weight': 800, fill: C.text }, g));
    if (n.tag) {
      const lastW = width(tl[tl.length - 1], 'cond', 26, 800);
      const tx = n.x + PAD + lastW + 8, ty = y + (tl.length - 1) * 28 - 18;
      el('rect', { x: tx, y: ty, width: tagW, height: 22, rx: 4, fill: C.panel2, stroke: C.line }, g);
      txt(n.tag, { x: tx + 6, y: ty + 16, class: 'mono', 'font-size': 13, 'font-weight': 500, fill: C.accent2 }, g);
    }
    let by = y + (tl.length - 1) * 28 + 10 + 24;
    bl.forEach((l, i) => txt(l, { x: n.x + PAD, y: by + i * 24 - 4, class: 'sans', 'font-size': 18, fill: C.muted }, g));
    if (n.pending) {
      const pw = width('PENDING', 'mono', 13, 500) + 8 * 1.5 + 22;
      const px = n.x + n.w - pw - 14, py = n.y - 12;
      el('rect', { x: px, y: py, width: pw, height: 24, rx: 12, fill: C.bg, stroke: C.pend, 'stroke-width': 1.2 }, g);
      txt('PENDING', { x: px + pw / 2, y: py + 17, 'text-anchor': 'middle', class: 'mono', 'font-size': 13, 'font-weight': 500, fill: C.muted, 'letter-spacing': 1.5 }, g);
    }
  });

  // edge labels
  E.forEach(e => {
    if (!e.label) return;
    const L = e.label; const anchor = L.anchor || 'middle';
    const color = L.key ? C.yellow : (e.kind === 'dash' ? C.muted : C.accent2);
    const lh = 22; const n = L.lines.length;
    const ws = L.lines.map(l => width(l, 'sans', 17, 500));
    const mw = Math.max(...ws);
    const top = L.y - (n * lh) / 2;
    const bx = anchor === 'start' ? L.x - 6 : L.x - mw / 2 - 8;
    const box = { x: bx, y: top - 3, w: mw + 16, h: n * lh + 6, id: e.id };
    labelBoxes.push(box);
    el('rect', { x: box.x, y: box.y, width: box.w, height: box.h, rx: 3, fill: C.bg });
    L.lines.forEach((l, i) => txt(l, { x: anchor === 'start' ? L.x + 2 : L.x, y: top + (i + 1) * lh - 5, 'text-anchor': anchor, class: 'sans', 'font-size': 17, 'font-weight': 500, fill: color }));
  });

  // legend
  const lx = 1430, ly = 1220;
  function legendItem(x, kind, label) {
    const a = { x1: x, y1: ly, x2: x + 56, y2: ly, 'stroke-width': 2.2 };
    if (kind === 'dash') { a.stroke = C.pend; a['stroke-dasharray'] = '8 8'; a['marker-end'] = 'url(#arrP)'; }
    else { a.stroke = C.edge; if (kind === 'solid') a['marker-end'] = 'url(#arr)'; }
    el('line', a);
    txt(label, { x: x + 68, y: ly + 6, class: 'sans', 'font-size': 17, 'font-weight': 500, fill: C.accent2 });
    return x + 68 + width(label, 'sans', 17, 500) + 36;
  }
  let x = legendItem(lx, 'solid', 'implemented');
  x = legendItem(x, 'dash', 'pending');
  x = legendItem(x, 'link', 'linked');
  if (x - 36 > 1970) warn.push('legend overflow ' + x);

  // caption
  txt('Solid = implemented. Dotted = pending live connection or implementation.', { x: 40, y: 1213, class: 'sans', 'font-size': 16, fill: C.muted });
  txt('Default browser mode is demo: localStorage events stand in for MultiBaas and no transactions are broadcast.', { x: 40, y: 1236, class: 'sans', 'font-size': 16, fill: C.muted });

  // ---- auto checks ----
  const rects = Object.entries(N).map(([id, n]) => ({ id, x: n.x + 2, y: n.y + 2, w: n.w - 4, h: n.h - 4 }));
  function segHitsRect(a, b, r) {
    const minx = Math.min(a[0], b[0]), maxx = Math.max(a[0], b[0]), miny = Math.min(a[1], b[1]), maxy = Math.max(a[1], b[1]);
    return maxx > r.x && minx < r.x + r.w && maxy > r.y && miny < r.y + r.h;
  }
  E.forEach(e => {
    for (let i = 1; i < e.pts.length; i++) {
      rects.forEach(r => { if (segHitsRect(e.pts[i - 1], e.pts[i], r)) warn.push('edge ' + e.id + ' crosses node ' + r.id); });
      labelBoxes.forEach(b => { if (b.id !== e.id && segHitsRect(e.pts[i - 1], e.pts[i], b)) warn.push('edge ' + e.id + ' crosses label of ' + b.id); });
    }
  });
  labelBoxes.forEach(b => rects.forEach(r => { if (segHitsRect([b.x, b.y], [b.x + b.w, b.y + b.h], r)) warn.push('label ' + b.id + ' overlaps node ' + r.id); }));
  meas.remove();
  window.__warnings = warn;
  window.__done = true;
}

Promise.all([
  document.fonts.load('800 26px "Barlow Condensed"'), document.fonts.load('600 20px "Barlow Condensed"'),
  document.fonts.load('400 18px "IBM Plex Sans"'), document.fonts.load('500 17px "IBM Plex Sans"'),
  document.fonts.load('500 14px "IBM Plex Mono"'),
]).then(() => document.fonts.ready).then(build);
</script>
</body>
</html>
